---
driver:
  name: docker

platforms:
  - name: debian13
    image: geerlingguy/docker-debian13-ansible:latest
    hostname: test-host
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  env:
    # Docker bind-mounts /etc/hosts, so atomic renames onto it fail with EBUSY.
    ANSIBLE_UNSAFE_WRITES: "true"
  playbooks:
    converge: converge.yml
    verify: verify.yml

verifier:
  name: ansible
